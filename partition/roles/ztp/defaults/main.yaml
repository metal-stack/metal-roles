---
ztp_host_dir_path: /ztp

ztp_authorized_keys:
ztp_admin_user: admin

ztp_listen_address: "{{ ansible_host }}"
ztp_port: 8080

ztp_additional_files: []
# - name: foo.sh
#   data: echo

ztp_nginx_docker_log_driver: json-file

# BISDN Linux switches: breakouts and FEC served for first boot, in the
# structure of sonic_config_breakouts / sonic_config_ports, e.g.
#   ztp_bisdn_switches:
#     leaf01:
#       breakouts: {port1: 4x25G}
#       ports: {default_fec: rs}
ztp_bisdn_switches: {}
# where switches download bisdn-portconf from (bsidn-test cmd/bisdn-portconf)
ztp_bisdn_portconf_url:
ztp_bisdn_portconf_checksum:

# BISDN Linux ONIE installer with integrated install config (SSH keys of
# ztp_authorized_keys for the basebox user, optional password hash), served
# as {{ ztp_bisdn_installer_name }}; empty URL disables it.
ztp_bisdn_installer_url:
# e.g. sha256:f8eba9f440095eb33bd08f12b6ba4c83953dd8da7757cdea0949c897fae9e2f2 for 6.0.0
ztp_bisdn_installer_checksum:
ztp_bisdn_installer_name: onie-installer-bisdn
# crypt hash for the basebox user (e.g. from mkpasswd -m sha-512), empty keeps
# BISDN's default password
ztp_bisdn_password_hash:
# on a reinstall, restore the previous installation's configuration instead of
# applying keys and password
ztp_bisdn_keep_config: true

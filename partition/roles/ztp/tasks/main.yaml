---
- name: Gather release versions
  setup_yaml:

- name: Check mandatory variables for this role are set
  ansible.builtin.assert:
    fail_msg: "not all mandatory variables given, check role documentation"
    quiet: true
    that:
      - ztp_nginx_image_name is defined
      - ztp_nginx_image_tag is defined
      - ztp_authorized_keys is not none
      - "'user.sh' not in ztp_additional_files | map(attribute='name')"

- name: Create ztp config directory
  ansible.builtin.file:
    path: "{{ ztp_host_dir_path }}/config"
    mode: "0755"
    state: directory

- name: Render templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ ztp_host_dir_path }}/config/{{ item | splitext | first }}"
    mode: "0644"
  loop:
    - ztp.json.j2
    - user.sh.j2

- name: Copy static files
  ansible.builtin.copy:
    dest: "{{ ztp_host_dir_path }}/config/{{ item }}"
    src: "{{ item }}"
    mode: "0644"
  loop:
    - frr.conf
    - config_db.json

- name: Copy additional files
  ansible.builtin.copy:
    dest: "{{ ztp_host_dir_path }}/config/{{ item.name }}"
    content: "{{ item.data }}"
    mode: "0644"
  loop: "{{ ztp_additional_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create BISDN switch directories
  ansible.builtin.file:
    path: "{{ ztp_host_dir_path }}/config/bisdn/{{ item }}"
    mode: "0755"
    state: directory
  loop: "{{ ztp_bisdn_switches | list }}"

- name: Render BISDN port configurations
  ansible.builtin.copy:
    dest: "{{ ztp_host_dir_path }}/config/bisdn/{{ item.key }}/ports.yaml"
    content: "{{ {'breakouts': item.value.breakouts | default({}), 'ports': item.value.ports | default({})} | to_nice_yaml }}"
    mode: "0644"
  loop: "{{ ztp_bisdn_switches | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Render BISDN first-boot script
  ansible.builtin.template:
    src: bisdn-ztp.sh.j2
    dest: "{{ ztp_host_dir_path }}/config/bisdn-ztp.sh"
    mode: "0644"
  when: ztp_bisdn_switches | length > 0

- name: Build BISDN Linux ONIE installer with integrated install config
  when: ztp_bisdn_installer_url
  block:
    - name: Check mandatory variables for the BISDN installer are set
      ansible.builtin.assert:
        quiet: true
        that:
          - ztp_bisdn_installer_checksum
          - ztp_authorized_keys | length > 0

    # BISDN's parser cuts the variable name at the last "=" of a line, so a
    # hash with "=" (e.g. sha512 with rounds=) would be ignored silently.
    - name: Check that the basebox password hash has no "="
      ansible.builtin.assert:
        quiet: true
        fail_msg: "ztp_bisdn_password_hash must not contain '=' (BISDN's install config parser cuts at it); create it without rounds=, e.g. mkpasswd -m sha-512"
        that:
          - "'=' not in (ztp_bisdn_password_hash | default('', true))"

    - name: Create BISDN installer directory
      ansible.builtin.file:
        path: "{{ ztp_host_dir_path }}/bisdn"
        mode: "0755"
        state: directory

    - name: Download BISDN Linux ONIE installer
      ansible.builtin.get_url:
        url: "{{ ztp_bisdn_installer_url }}"
        dest: "{{ ztp_host_dir_path }}/bisdn/vendor.bin"
        checksum: "{{ ztp_bisdn_installer_checksum }}"
        mode: "0644"
      register: ztp_bisdn_vendor_installer_result

    # The installer reads everything after its last conf_marker line as
    # integrated install config; its checksum only covers the payload before.
    - name: Check that the BISDN installer ends with a conf_marker line
      ansible.builtin.command: tail -c 12 "{{ ztp_host_dir_path }}/bisdn/vendor.bin"
      register: ztp_bisdn_installer_tail_result
      changed_when: false
      failed_when: ztp_bisdn_installer_tail_result.stdout != "conf_marker"

    - name: Render BISDN install config
      ansible.builtin.template:
        src: bisdn-install.conf.j2
        dest: "{{ ztp_host_dir_path }}/bisdn/install.conf"
        mode: "0644"
      register: ztp_bisdn_install_conf_result

    - name: Check whether the BISDN installer was built before
      ansible.builtin.stat:
        path: "{{ ztp_host_dir_path }}/config/{{ ztp_bisdn_installer_name }}"
      register: ztp_bisdn_installer_result

    - name: Append the install config to the BISDN installer
      ansible.builtin.shell: >-
        set -o pipefail &&
        cat "{{ ztp_host_dir_path }}/bisdn/vendor.bin" "{{ ztp_host_dir_path }}/bisdn/install.conf"
        > "{{ ztp_host_dir_path }}/config/{{ ztp_bisdn_installer_name }}.tmp" &&
        chmod 0644 "{{ ztp_host_dir_path }}/config/{{ ztp_bisdn_installer_name }}.tmp" &&
        mv "{{ ztp_host_dir_path }}/config/{{ ztp_bisdn_installer_name }}.tmp" "{{ ztp_host_dir_path }}/config/{{ ztp_bisdn_installer_name }}"
      args:
        executable: /bin/bash
      changed_when: true
      when: ztp_bisdn_vendor_installer_result is changed or ztp_bisdn_install_conf_result is changed or not ztp_bisdn_installer_result.stat.exists

- name: Deploy server for serving ztp files
  ansible.builtin.include_role:
    name: ansible-common/roles/systemd-docker-service
  vars:
    systemd_service_name: ztp-server
    systemd_docker_image_name: "{{ ztp_nginx_image_name }}"
    systemd_docker_image_tag: "{{ ztp_nginx_image_tag }}"
    systemd_service_timeout_start_sec: 60
    systemd_docker_volumes:
      - "{{ ztp_host_dir_path }}/config:/usr/share/nginx/html"
    systemd_docker_ports:
      - host_port: "{{ ztp_port }}"
        target_port: "80"
    systemd_docker_log_driver: "{{ ztp_nginx_docker_log_driver }}"

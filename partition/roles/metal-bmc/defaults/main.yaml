---
metal_bmc_ignore_macs: []
metal_bmc_allowed_cidrs:
  - 0.0.0.0/0

metal_bmc_etc_dir: /etc/metal-bmc
metal_bmc_bmc_superuser:
metal_bmc_bmc_superuser_pwd:
metal_bmc_nsq_log_level: info
metal_bmc_nsq_tls_enabled: true
metal_bmc_nsq_cert_dir: "{{ metal_bmc_etc_dir }}/certs/nsq"
metal_bmc_nsqd_ca_cert:
metal_bmc_nsqd_client_cert:
metal_bmc_nsqd_client_cert_key:
metal_bmc_console_port: 3333
metal_bmc_console_cert_owner: root
metal_bmc_console_cert_group: root
metal_bmc_console_cert_dir: "{{ metal_bmc_etc_dir }}/certs/console"
metal_bmc_console_ca_cert:
metal_bmc_console_cert:
metal_bmc_console_key:
metal_bmc_additional_volume_mounts: []
metal_bmc_docker_network:
metal_bmc_docker_log_driver: json-file

metal_bmc_lease_file: /var/lib/dhcp/dhcpd.leases

metal_bmc_metal_apiserver_url: "{{ defaults_partition_metal_apiserver_url }}"
metal_bmc_metal_apiserver_token_filename: metal-apiserver-token
metal_bmc_deployment_admin_token: "{{ defaults_partition_metal_apiserver_admin_token }}"
metal_bmc_token_expiration: 144h
metal_bmc_permissions:
  - self:
      methods:
        - /metalstack.api.v2.TokenService/Refresh
  - infra:
      methods:
        - /metalstack.infra.v2.ComponentService/Ping
        - /metalstack.infra.v2.BMCService/BMCCommandDone
        - /metalstack.infra.v2.BMCService/UpdateBMCInfo
        - /metalstack.infra.v2.BMCService/WaitForBMCCommand

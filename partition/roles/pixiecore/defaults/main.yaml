---
pixiecore_dns_servers: []
pixiecore_partition_id: "{{ metal_partition_id }}"
pixiecore_debug: false
pixiecore_api_port: 4242
pixiecore_docker_log_driver: json-file

pixiecore_metal_apiserver_url: "{{ defaults_partition_metal_apiserver_url }}"
pixiecore_deployment_admin_token: "{{ defaults_partition_metal_apiserver_admin_token }}"
pixiecore_metal_apiserver_token_path: "{{ pixiecore_grpc_cert_dir }}/pixiecore-token"
pixiecore_token_expiration: 8h
pixiecore_permissions:
  - self:
      methods:
        - /metalstack.api.v2.TokenService/Refresh
        - /metalstack.api.v2.PartitionService/List
  - admin:
      methods:
        - /metalstack.admin.v2.TenantService/List
        - /metalstack.admin.v2.TokenService/Create
  - infra:
      methods:
        - /metalstack.infra.v2.BootService
        - /metalstack.infra.v2.ComponentService/Ping



pixiecore_metal_hammer_logging_endpoint:
pixiecore_metal_hammer_logging_user:
pixiecore_metal_hammer_logging_password:
pixiecore_metal_hammer_logging_cert:
pixiecore_metal_hammer_logging_key:
pixiecore_metal_hammer_logging_tls_insecure: false
pixiecore_metal_hammer_ntp_servers: []
pixiecore_additional_volume_mounts: []

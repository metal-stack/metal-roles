# Managed by the sonic-config role, see sonic_config_frr_reload_enforce_integrated_vtysh_config.
#
# Some SONiC distributions (e.g. AsterNOS) do not support docker_routing_config_mode `split-unified`.
# In `split` mode their bgp container writes `no service integrated-vtysh-config` to /etc/frr/vtysh.conf
# on every start, which makes frr-reload refuse to apply /etc/frr/frr.conf.
# Switch vtysh to the integrated config right before every reload.
[Service]
ExecStartPre=/usr/bin/docker exec bgp sh -c 'echo "service integrated-vtysh-config" > /etc/frr/vtysh.conf'

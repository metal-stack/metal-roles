    dhcp_servers: ["10.255.255.254"]
    ip: "10.255.255.1/24"
    untagged_ports:
      - Ethernet0
  - id: 10
    ip: "10.252.253.125/30"
    vrf: vrfACPmgmt
    untagged_ports:
      - Ethernet47
  - id: 11
    vrf: vrfACPmgmt
    tagged_ports:
      - Ethernet120

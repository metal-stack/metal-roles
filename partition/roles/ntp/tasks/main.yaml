---
- name: Install systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    update_cache: true
    cache_valid_time: 3600

- name: Create the systemd-timesyncd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"

- name: Point systemd-timesyncd at the configured ntp servers
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/ntp.conf
    mode: "0644"
    content: |
      [Time]
      NTP={{ ntp_servers | join(' ') }}
      FallbackNTP={{ ntp_fallback_servers | join(' ') }}
  notify: Restart systemd-timesyncd

- name: Enable and start systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

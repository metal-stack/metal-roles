---
- name: Download FRR repository signing key
  ansible.builtin.get_url:
    url: https://deb.frrouting.org/frr/keys.gpg
    dest: /usr/share/keyrings/frrouting.gpg
    mode: "0644"

- name: Configure FRR repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/frr.list
    content: |
      deb [signed-by=/usr/share/keyrings/frrouting.gpg] https://deb.frrouting.org/frr {{ ansible_distribution_release }} {{ frr_repo }}
    mode: "0644"

- name: Install required packages to have the network stack in place
  ansible.builtin.apt:
    name:
      - frr={{ frr_version }}*
      - frr-pythontools={{ frr_version }}*
    update_cache: true
    force_apt_get: true

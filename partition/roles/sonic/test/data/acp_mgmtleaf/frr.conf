frr defaults datacenter
hostname r03acpmgmtleaf
!
service integrated-vtysh-config
!
agentx
log syslog informational
!
vrf vrfACPmgmt
exit-vrf
!
interface Ethernet120
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface Vlan11 vrf vrfACPmgmt
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
router bgp 420000003
 bgp router-id 10.0.0.3
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 1 3
 neighbor Ethernet120 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  redistribute connected route-map DENY_MGMT
 exit-address-family
!
router bgp 420000003 vrf vrfACPmgmt
 bgp router-id 10.0.0.3
 bgp bestpath as-path multipath-relax
 neighbor ACP peer-group
 neighbor ACP remote-as external
 neighbor ACP timers 1 3
 neighbor Vlan11 interface peer-group ACP
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
!
route-map DENY_MGMT deny 10
  match interface eth0
route-map DENY_MGMT permit 20
!
line vty
!

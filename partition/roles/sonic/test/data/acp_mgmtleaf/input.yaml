---
inventory_hostname: r03acpmgmtleaf

sonic_mgmtif_ip: "10.255.255.250/30"
sonic_mgmtif_gateway: 10.255.255.249

sonic_loopback_address: 10.0.0.3
sonic_asn: 420000003
sonic_ntpservers: ["1.2.3.4"]

sonic_ports_default_mtu: 9000
sonic_ports_default_speed: 1000
sonic_ports_dict:
  Ethernet0:
  Ethernet47:
  Ethernet120:
    speed: 100000
    mtu: 9216
    fec: rs

sonic_running_cfg_breakouts: {}
sonic_running_cfg_hwsku: Accton-AS7726-32X
sonic_running_cfg_mac: e0:01:a6:e3:29:3c
sonic_running_cfg_platform: x86_64-accton_as7726_32x-r0

sonic_running_cfg_ports:
  Ethernet0:
    alias: Eth1(Port1)
    index: "1"
    lanes: "1,2,3,4"
    parent_port: Ethernet0
    speed: "100000"
  Ethernet47:
    alias: Eth12(Port12)
    index: "12"
    lanes: "45,46,47,48"
    parent_port: Ethernet47
    speed: "100000"
  Ethernet120:
    alias: Eth31(Port31)
    index: "31"
    lanes: "121,122,123,124"
    parent_port: Ethernet120
    speed: "100000"

sonic_bgp_ports:
  - Ethernet120

sonic_vlans:
  # server oob, default vrf
  - id: 1
    dhcp_servers: ["10.255.255.254"]
    ip: "10.255.255.1/24"
    untagged_ports:
      - Ethernet0
  # oob net of the acp leaf, layer-3 vrf
  - id: 10
    ip: "10.252.253.125/30"
    vrf: vrfACPmgmt
    untagged_ports:
      - Ethernet47
  # unnumbered svi towards the mgmtspine, tagged on the uplink. Same vrf, no ip.
  - id: 11
    vrf: vrfACPmgmt
    tagged_ports:
      - Ethernet120

sonic_interconnects:
  acpmgmt:
    # no vni on purpose: plain layer-3 vrf, this switch is not a vtep
    vrf: vrfACPmgmt
    peer_group: ACP
    # both sides use private ASNs inside the fabric
    keep_private_as: true
    unnumbered_interfaces:
      - Vlan11
    announcements:
      - redistribute connected

---
- name: Gather release versions
  setup_yaml:

- name: Check mandatory variables for this role are set
  ansible.builtin.assert:
    fail_msg: "not all mandatory variables given, check role documentation"
    quiet: true
    that:
      - monitoring_gnmic_image_name is defined
      - monitoring_gnmic_image_tag is defined

- name: Check SONiC distribution is supported
  ansible.builtin.assert:
    that: monitoring_gnmic_sonic_distribution in ['broadcom', 'edgecore']
    fail_msg: "monitoring_gnmic_sonic_distribution must be one of: broadcom, edgecore"

- name: Determine ports
  ansible.builtin.command: sonic-cfggen -d --var-json PORT
  register: monitoring_gnmic_port_json
  changed_when: false
  when: monitoring_gnmic_ports | length == 0

- name: Set port list
  ansible.builtin.set_fact:
    monitoring_gnmic_ports: "{{ (monitoring_gnmic_port_json.stdout | from_json).keys() | select('match', '^Ethernet[0-9]+$') | list }}"
  when: monitoring_gnmic_ports | length == 0

- name: Determine temperature sensors
  ansible.builtin.command: sonic-db-cli STATE_DB KEYS "TEMPERATURE_INFO|*"
  register: monitoring_gnmic_temperature_keys
  changed_when: false
  when: monitoring_gnmic_temperature_sensors | length == 0

- name: Set temperature sensor list
  ansible.builtin.set_fact:
    monitoring_gnmic_temperature_sensors: "{{ monitoring_gnmic_temperature_keys.stdout_lines | map('regex_replace', '^TEMPERATURE_INFO\\|', '') | list }}"
  when: monitoring_gnmic_temperature_sensors | length == 0

- name: Determine fans
  ansible.builtin.command: sonic-db-cli STATE_DB KEYS "FAN_INFO|*"
  register: monitoring_gnmic_fan_keys
  changed_when: false
  when: monitoring_gnmic_fans | length == 0

- name: Set fan list
  ansible.builtin.set_fact:
    monitoring_gnmic_fans: "{{ monitoring_gnmic_fan_keys.stdout_lines | map('regex_replace', '^FAN_INFO\\|', '') | list }}"
  when: monitoring_gnmic_fans | length == 0

- name: Determine PSUs
  ansible.builtin.command: sonic-db-cli STATE_DB KEYS "PSU_INFO|*"
  register: monitoring_gnmic_psu_keys
  changed_when: false
  when: monitoring_gnmic_psus | length == 0

- name: Set PSU list
  ansible.builtin.set_fact:
    monitoring_gnmic_psus: "{{ monitoring_gnmic_psu_keys.stdout_lines | map('regex_replace', '^PSU_INFO\\|', '') | list }}"
  when: monitoring_gnmic_psus | length == 0

- name: Determine SYSTEM_READY availability
  ansible.builtin.command: sonic-db-cli STATE_DB KEYS "SYSTEM_READY|*"
  register: monitoring_gnmic_system_ready_keys
  changed_when: false
  when: monitoring_gnmic_system_ready is none

- name: Set SYSTEM_READY availability
  ansible.builtin.set_fact:
    monitoring_gnmic_system_ready: "{{ monitoring_gnmic_system_ready_keys.stdout_lines | length > 0 }}"
  when: monitoring_gnmic_system_ready is none

- name: Determine CRM ACL tables
  ansible.builtin.command: sonic-db-cli COUNTERS_DB KEYS "CRM:ACL_STATS:*"
  register: monitoring_gnmic_crm_acl_keys
  changed_when: false
  when: monitoring_gnmic_crm_acl_tables | length == 0

- name: Set CRM ACL table list
  ansible.builtin.set_fact:
    monitoring_gnmic_crm_acl_tables: "{{ monitoring_gnmic_crm_acl_keys.stdout_lines | map('regex_replace', '^CRM:ACL_STATS:', '') | list }}"
  when: monitoring_gnmic_crm_acl_tables | length == 0

- name: Determine queues
  ansible.builtin.command: sonic-db-cli COUNTERS_DB HGETALL COUNTERS_QUEUE_NAME_MAP
  register: monitoring_gnmic_queue_map
  changed_when: false
  when: monitoring_gnmic_queues | length == 0

- name: Set queue map
  vars:
    monitoring_gnmic_queue_lines: "{{ monitoring_gnmic_queue_map.stdout_lines }}"
    monitoring_gnmic_queue_dict: "{{ (monitoring_gnmic_queue_map.stdout | from_yaml) if monitoring_gnmic_queue_map.stdout.startswith('{') else dict(monitoring_gnmic_queue_lines[0::2] | zip(monitoring_gnmic_queue_lines[1::2])) }}"
    monitoring_gnmic_queue_pattern: "^({{ monitoring_gnmic_ports | join('|') }}):[0-9]+$"
  ansible.builtin.set_fact:
    monitoring_gnmic_queues: "{{ monitoring_gnmic_queue_dict | dict2items | selectattr('key', 'match', monitoring_gnmic_queue_pattern) | items2dict }}"
  when: monitoring_gnmic_queues | length == 0

- name: Create gnmic directories
  ansible.builtin.file:
    path: "{{ monitoring_gnmic_etc_host_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"

- name: Copy gnmic config
  ansible.builtin.template:
    src: gnmic.yaml.j2
    dest: "{{ monitoring_gnmic_etc_host_dir }}/gnmic.yaml"
    mode: "0600"
  notify:
    - Restart gnmic

- name: Copy LLDP processor script
  ansible.builtin.copy:
    src: lldp-neighbors.star
    dest: "{{ monitoring_gnmic_etc_host_dir }}/lldp-neighbors.star"
    mode: "0644"
  notify:
    - Restart gnmic

- name: Copy filter processor script
  ansible.builtin.copy:
    src: sonic-filter.star
    dest: "{{ monitoring_gnmic_etc_host_dir }}/sonic-filter.star"
    mode: "0644"
  notify:
    - Restart gnmic

- name: Copy metrics processor script
  ansible.builtin.template:
    src: sonic-metrics.star.j2
    dest: "{{ monitoring_gnmic_etc_host_dir }}/sonic-metrics.star"
    mode: "0644"
  notify:
    - Restart gnmic

- name: Deploy gnmic service
  ansible.builtin.include_role:
    name: ansible-common/roles/systemd-docker-service
  vars:
    systemd_service_name: gnmic
    systemd_docker_image_name: "{{ monitoring_gnmic_image_name }}"
    systemd_docker_image_tag: "{{ monitoring_gnmic_image_tag }}"
    systemd_service_after: docker.service
    systemd_service_requires: docker.service
    systemd_docker_network: host
    systemd_docker_volumes:
      - "{{ monitoring_gnmic_etc_host_dir }}:/app/config:ro"
    systemd_docker_command:
      - subscribe --config /app/config/gnmic.yaml
    systemd_docker_log_driver: "{{ monitoring_gnmic_docker_log_driver }}"

- name: Wait for gnmic to listen on port
  ansible.builtin.wait_for:
    port: "{{ monitoring_gnmic_prometheus_port }}"
    timeout: 300
    msg: "gnmic did not come up"

---
- name: Check mandatory variables for this role are set
  ansible.builtin.assert:
    fail_msg: "not all mandatory variables given, check role documentation"
    quiet: true
    that:
      - k3s_server_asn is not none
      - k3s_server_loopback_address is not none
      - k3s_server_uplink_interfaces | length > 0
      - k3s_server_cluster_init_host is not none
      - k3s_server_token | default('', true) | length > 0
      - k3s_server_version | default('', true) | length > 0

- name: Update the interface facts because the dummy interfaces are created by the systemd-networkd role
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - network
  when: k3s_server_api_vip_address is not none or k3s_server_metallb_asn is not none

- name: Check the interface for the api vip exists
  ansible.builtin.assert:
    fail_msg: "{{ k3s_server_api_vip_interface }} does not exist, add it to systemd_networkd_dummies and run the systemd-networkd role first"
    quiet: true
    that:
      - k3s_server_api_vip_interface in ansible_facts.interfaces
  when: k3s_server_api_vip_address is not none

- name: Check the interface for the metallb bgp session exists
  ansible.builtin.assert:
    fail_msg: "{{ k3s_server_metallb_interface }} does not exist, add it with {{ k3s_server_metallb_local_address }} and {{ k3s_server_metallb_speaker_address }} to systemd_networkd_dummies and run the systemd-networkd role first"
    quiet: true
    that:
      - k3s_server_metallb_interface in ansible_facts.interfaces
  when: k3s_server_metallb_asn is not none

- name: Check metallb has addresses to hand out
  ansible.builtin.assert:
    fail_msg: "set k3s_server_metallb_addresses, otherwise metallb assigns nothing"
    quiet: true
    that:
      - k3s_server_metallb_addresses | length > 0
  when: k3s_server_metallb_asn is not none

- name: Check frr accepts what metallb hands out
  ansible.builtin.assert:
    fail_msg: "set k3s_server_metallb_accept_prefixes, usually every entry of k3s_server_metallb_addresses followed by ' ge 32', otherwise frr drops what metallb announces"
    quiet: true
    that:
      - k3s_server_metallb_accept_prefixes | length > 0
  when: k3s_server_metallb_asn is not none

- name: Check the packaged load balancer stays disabled
  ansible.builtin.assert:
    fail_msg: "servicelb and metallb both allocate LoadBalancer addresses, keep servicelb in k3s_server_disable"
    quiet: true
    that:
      - "'servicelb' in k3s_server_disable"
  when: k3s_server_metallb_asn is not none

- name: Render frr configuration
  ansible.builtin.set_fact:
    frr_conf: "{{ lookup('template', 'frr.conf.j2') }}"

- name: Install and configure frr
  ansible.builtin.include_role:
    name: metal-roles/partition/roles/frr

- name: Flush handlers to let bgp converge before k3s starts
  ansible.builtin.meta: flush_handlers

---
- name: Create api token for metal-core
  delegate_to: localhost
  environment:
    METAL_APIV2_URL: "{{ metal_core_metal_apiserver_url }}"
    METAL_APIV2_TOKEN: "{{ metal_core_deployment_admin_token }}"
  block:
    - name: Create metal-core tenant
      run_once: true
      metal_v2_admin_tenant:
        identifier: metal-core
        name: metal-core
        description: tenant used by the metal-core service in the metal-stack partitions
      register: _tenant

    - name: Create token
      metal_v2_admin_token:
        identifier: metal-core-{{ inventory_hostname }}
        use_latest_identifier: true
        user: "{{ _tenant.id }}"
        description: "metal-core token {{ inventory_hostname }} in partition {{ metal_partition_id }}"
        expires: "{{ metal_core_token_expiration }}"
        permissions: "{{ metal_core_permissions }}"
      register: _token

- name: Write token to file
  when: '"secret" in _token'
  block:
    - name: Create metal-core directory
      ansible.builtin.file:
        path: "{{ metal_core_etc_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write token to filesystem
      ansible.builtin.copy:
        content: "{{ _token.secret }}"
        dest: "{{ metal_core_etc_dir }}/{{ metal_core_metal_apiserver_token_filename }}"
        mode: "0600"

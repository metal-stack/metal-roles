---
- name: Check mandatory variables for this role are set
  ansible.builtin.assert:
    fail_msg: "haproxy_services is empty, check role documentation"
    quiet: true
    that:
      - haproxy_services | length > 0

- name: Check every service carries a name, a port, a bind address and a backend
  ansible.builtin.assert:
    fail_msg: "service {{ item.name | default('without a name') }} needs name, port, bind_addresses and backends"
    quiet: true
    that:
      - item.name | default('') | length > 0
      - item.port is defined
      - item.bind_addresses | default([]) | length > 0
      - item.backends | default([]) | length > 0
  loop: "{{ haproxy_services }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Check every health check is one this role implements
  ansible.builtin.assert:
    fail_msg: "service {{ item.name }} asks for healthcheck '{{ item.healthcheck }}', pick one of {{ haproxy_healthchecks | join(', ') }} or drop the key"
    quiet: true
    that:
      - item.healthcheck in haproxy_healthchecks
  loop: "{{ haproxy_services | selectattr('healthcheck', 'defined') | list }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Check the certificates of the ssl terminating services are present
  ansible.builtin.stat:
    path: "{{ item.ssl_cert }}"
  loop: "{{ haproxy_services | selectattr('ssl_cert', 'defined') | selectattr('ssl_cert') | list }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  register: haproxy_certificates

- name: Fail on a missing certificate before the configuration is validated
  ansible.builtin.assert:
    fail_msg: "service {{ item.item.name }} needs the pem bundle {{ item.item.ssl_cert }}, this role does not deploy it"
    quiet: true
    that:
      - item.stat.exists
  loop: "{{ haproxy_certificates.results }}"
  loop_control:
    label: "{{ item.item.name | default('unnamed') }}"

- name: Install haproxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow binding to addresses that appear late during boot
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: true
  when: haproxy_nonlocal_bind

- name: Deploy haproxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reload haproxy

- name: Enable and start haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started

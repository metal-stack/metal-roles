---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metal-token-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metal-token-refresher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["metal-metrics-exporter-token"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metal-token-refresher
subjects:
- kind: ServiceAccount
  name: metal-token-refresher
roleRef:
  kind: Role
  name: metal-token-refresher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: metal-metrics-exporter-token-refresher
spec:
  schedule: "@hourly"
  jobTemplate:
    metadata:
      name: metal-metrics-exporter-token-refresher
    spec:
      template:
        spec:
          serviceAccountName: metal-token-refresher
          restartPolicy: OnFailure
          containers:
          - name: token-refresher
            image: {{ monitoring_metal_metrics_exporter_token_refresher_image_name }}:{{ monitoring_metal_metrics_exporter_token_refresher_image_tag }}
            imagePullPolicy: {{ monitoring_metal_metrics_exporter_image_pull_policy }}
            env:
            - name: METAL_APISERVER_URL
              value: {{ monitoring_metal_apiserver_url }}
            - name: TOKEN_SECRET_NAMESPACE
              value: "monitoring"
            - name: TOKEN_SECRET_NAME
              value: "metal-metrics-exporter-token"
            - name: TOKEN_SECRET_KEY
              value: "token"
---
apiVersion: v1
kind: Service
metadata:
  name: metal-metrics-exporter
  labels:
    app: metal-metrics-exporter
spec:
  ports:
    - name: metrics
      port: 9080
      targetPort: metrics
  selector:
    app: metal-metrics-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metal-metrics-exporter
  labels:
    app: metal-metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metal-metrics-exporter
  template:
    metadata:
      labels:
        app: metal-metrics-exporter
      annotations:
        token_id: {{ _token.id }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: metal-metrics-exporter
          command:
            - /metal-metrics-exporter
          image: {{ metal_metrics_exporter_image_name }}:{{ metal_metrics_exporter_image_tag }}
          imagePullPolicy: {{ monitoring_metal_metrics_exporter_image_pull_policy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - containerPort: 9080
              name: metrics
          env:
            - name: METAL_API_URL
              value: {{ monitoring_metal_apiserver_url }}
            - name: METAL_API_TOKEN_FILE
              value: /var/run/secrets/metal-metrics-exporter-token/token
          volumeMounts:
          - mountPath: /var/run/secrets/metal-metrics-exporter-token
            name: token
      volumes:
      - name: token
        secret:
          defaultMode: 420
          secretName: metal-metrics-exporter-token

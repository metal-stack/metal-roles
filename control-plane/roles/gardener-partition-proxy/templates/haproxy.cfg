global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 3600s
    timeout check 5s
    default-server inter 5s fall 3 rise 2

frontend health
    bind *:8404
    option dontlog-normal
    monitor-uri /healthz
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s

frontend partition_proxy
    bind *:8443 ssl crt-list /usr/local/etc/haproxy/crt-list.cfg alpn h2,http/1.1
    # routing is based on SNI, which is also what selects the certificate and the client certificate verification
{% for conf in gardener_shooted_seed.proxy_servers %}
    use_backend bk_{{ conf.name }} if { ssl_fc_sni -i {{ conf.ingress_domain }} }
{% endfor %}

{% for conf in gardener_shooted_seed.proxy_servers %}
backend bk_{{ conf.name }}
    balance roundrobin
{% if conf.health_check_path | default(none) and conf.type in ['http', 'https'] %}
    option httpchk
    http-check send meth GET uri {{ conf.health_check_path }}
    http-check expect status 200-399
{% endif %}
{% for addr in conf.addresses %}
{% if conf.type == 'grpcs' %}
    server {{ conf.name }}-{{ loop.index }} {{ addr }} ssl verify none alpn h2 check
{% elif conf.type == 'https' %}
    server {{ conf.name }}-{{ loop.index }} {{ addr }} ssl verify none check
{% elif conf.type == 'http' %}
    server {{ conf.name }}-{{ loop.index }} {{ addr }} check
{% endif %}
{% endfor %}

{% endfor %}

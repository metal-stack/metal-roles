---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: isolated-clusters
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: "{{ isolated_clusters_group_label }}"
data:
  config.yml: |
    version: 0.1
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oci-purge
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: oci-purge
    app.kubernetes.io/part-of: isolated-clusters
    app.kubernetes.io/managed-by: ansible
    app.kubernetes.io/part-of: "{{ isolated_clusters_group_label }}"
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  schedule: "20 2 1 * *"
  successfulJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: registry
            app.kubernetes.io/component: oci-purge
            app.kubernetes.io/part-of: isolated-clusters
            app.kubernetes.io/managed-by: ansible
            app.kubernetes.io/part-of: "{{ isolated_clusters_group_label }}"
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: registry
                    app.kubernetes.io/component: registry
                topologyKey: kubernetes.io/hostname
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: registry
                    app.kubernetes.io/component: oci-mirror
                topologyKey: kubernetes.io/hostname
          initContainers:
          - name: purge
            image: "{{ isolated_clusters_registry_oci_mirror_image_name }}:{{ isolated_clusters_registry_oci_mirror_image_tag }}"
            imagePullPolicy: {{ metal_control_plane_image_pull_policy }}
            args:
            - purge-unknown
            - --mirror-config=/config/oci-mirror.yaml
            volumeMounts:
            - name: oci-mirror-config
              mountPath: /config
          containers:
          - name: gc
            image: "{{ isolated_clusters_registry_image_name }}:{{ isolated_clusters_registry_image_tag }}"
            imagePullPolicy: {{ metal_control_plane_image_pull_policy }}
            command:
            - /bin/registry
            - garbage-collect
            - --delete-untagged
            - /etc/config/config.yml
            volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
              subPath: registry
            - name: registry-config
              mountPath: /etc/config
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: oci-mirror-config
            configMap:
              name: oci-mirror-config
              items:
              - key: oci-mirror.yaml
                path: oci-mirror.yaml
          - name: storage
            persistentVolumeClaim:
              claimName: storage-registry-0
          - name: registry-config
            configMap:
              name: registry-config
